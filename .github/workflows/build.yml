name: Build

on:
  pull_request:
  workflow_dispatch:

# One build per ref: a follow-up push to the same branch cancels the run still going. Minutes are
# billed on a private repository, so a superseded run is money spent on an answer nobody reads.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: npm test
      - name: Bundle
        run: npm run build
      - name: Pack the Claude Desktop bundle
        run: npm run pack:mcpb
      - name: Smoke the bundle
        run: |
          set -o pipefail
          # The pipe stays open while the answer arrives: closing stdin immediately can end the
          # stdio session before the response is flushed.
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            sleep 3
          } | JEV_MCP_ENV=/dev/null JEV_URL=https://api.typesafe.ai/v1/systemone JEV_API_KEY=smoke \
              timeout 20 node mcp-server/dist/jev-mcp.cjs --stdio \
            | head -1 | grep -q '"serverInfo":{"name":"jev-mcp"'

  desktop:
    name: Desktop (${{ matrix.target }})
    # The expensive half: three runners, and on a private repository macOS bills at 10x and Windows
    # at 2x against the minute quota. `release.yml` builds and signs the same three targets while
    # cutting the release, so on a pull request this would be a second, unpaid-for answer to a
    # question the release already answers. It runs on demand instead - `gh workflow run build.yml`
    # - ahead of a release.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webkit dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build the sidecar
        run: npm run sidecar --workspace mcp-server -- ${{ matrix.target }}
      - name: Build the app
        run: npx --yes @tauri-apps/cli build
        working-directory: desktop-app
